<!DOCTYPE html>

<section
    id="mission-board"
    class="mission-board">

    <!-- ==========================================
         Header
    =========================================== -->

    <header
        class="mission-board-header">

        <div>

            <h2 class="mission-board-title">

                Mission Board

            </h2>

            <p class="mission-board-subtitle">

                Strategic missions and executive objectives.

            </p>

        </div>

    </header>

    <!-- ==========================================
         Mission Summary
    =========================================== -->

    <section
        class="mission-summary">

        <div
            id="active-missions"
            class="mission-card">

        </div>

        <div
            id="completed-missions"
            class="mission-card">

        </div>

        <div
            id="priority-missions"
            class="mission-card">

        </div>

    </section>

    <!-- ==========================================
         Mission List
    =========================================== -->

    <section
        id="mission-list"
        class="mission-list">

    </section>

    <!-- ==========================================
         Footer
    =========================================== -->

    <footer
        class="mission-board-footer">

        <small>

            Mission Board v1.0

        </small>

    </footer>

</section>
