<!DOCTYPE html>

<!--
==========================================================
SKOS Executive Command Center
WorkScape Topbar Component
Version : 1.0.0
Component : Topbar
==========================================================
-->

<header
    id="workspace-topbar"
    class="workspace-topbar">

    <!-- ==========================================
         Left Section
    =========================================== -->

    <div class="topbar-left">

        <button
            id="menu-toggle"
            class="topbar-button">

            <img
                src="../../assets/icons/navigation/menu.svg"
                alt="Menu">

        </button>

        <h1 class="workspace-title">

            Executive Command Center

        </h1>

    </div>

    <!-- ==========================================
         Center Section
    =========================================== -->

    <div class="topbar-center">

        <div class="search-box">

            <img
                src="../../assets/icons/navigation/search.svg"
                alt="Search">

            <input
                type="text"
                id="workspace-search"
                placeholder="Search WorkScape...">

        </div>

    </div>

    <!-- ==========================================
         Right Section
    =========================================== -->

    <div class="topbar-right">

        <button
            id="refresh-button"
            class="topbar-button">

            <img
                src="../../assets/icons/navigation/refresh.svg"
                alt="Refresh">

        </button>

        <button
            id="notification-button"
            class="topbar-button">

            🔔

        </button>

        <div class="user-profile">

            <span class="user-name">

                Administrator

            </span>

        </div>

    </div>

</header>
