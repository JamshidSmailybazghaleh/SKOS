<!DOCTYPE html>

<!--
==========================================================
SKOS Executive Command Center
Operation Board Component
Version : 1.0.0
==========================================================
-->

<section
    id="operation-board"
    class="operation-board">


    <!-- ==========================================
         Header
    =========================================== -->

    <header
        class="operation-board-header">

        <div>

            <h2 class="operation-board-title">

                Operation Board

            </h2>


            <p class="operation-board-subtitle">

                Operational execution, workflows and system activities.

            </p>

        </div>


    </header>



    <!-- ==========================================
         Operation Summary
    =========================================== -->

    <section
        class="operation-summary">


        <div
            id="running-operations"
            class="operation-card">

        </div>


        <div
            id="pending-operations"
            class="operation-card">

        </div>


        <div
            id="completed-operations"
            class="operation-card">

        </div>


        <div
            id="failed-operations"
            class="operation-card">

        </div>


    </section>



    <!-- ==========================================
         Workflow Area
    =========================================== -->

    <section
        class="workflow-area">


        <div
            id="operation-list"
            class="operation-list">

        </div>


    </section>



    <!-- ==========================================
         Execution Monitor
    =========================================== -->

    <section
        class="execution-monitor">


        <div
            id="execution-status"
            class="execution-panel">

        </div>


        <div
            id="workflow-status"
            class="execution-panel">

        </div>


    </section>



    <!-- ==========================================
         Footer
    =========================================== -->

    <footer
        class="operation-board-footer">


        <small>

            Operation Board v1.0

        </small>


    </footer>


</section>
