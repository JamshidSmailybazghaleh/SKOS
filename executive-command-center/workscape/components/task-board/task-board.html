<!DOCTYPE html>

<!--
==========================================================
SKOS Executive Command Center
Task Board Component
Version : 1.0.0
==========================================================
-->

<section
    id="task-board"
    class="task-board">

    <!-- ==========================================
         Header
    =========================================== -->

    <header
        class="task-board-header">

        <div>

            <h2 class="task-board-title">

                Task Board

            </h2>

            <p class="task-board-subtitle">

                Operational tasks and execution tracking.

            </p>

        </div>

    </header>

    <!-- ==========================================
         Summary
    =========================================== -->

    <section
        class="task-summary">

        <div
            id="todo-summary"
            class="task-card">

        </div>

        <div
            id="progress-summary"
            class="task-card">

        </div>

        <div
            id="completed-summary"
            class="task-card">

        </div>

        <div
            id="priority-summary"
            class="task-card">

        </div>

    </section>

    <!-- ==========================================
         Task Columns
    =========================================== -->

    <section
        class="task-columns">

        <div
            id="todo-column"
            class="task-column">

        </div>

        <div
            id="progress-column"
            class="task-column">

        </div>

        <div
            id="completed-column"
            class="task-column">

        </div>

    </section>

    <!-- ==========================================
         Footer
    =========================================== -->

    <footer
        class="task-board-footer">

        <small>

            Task Board v1.0

        </small>

    </footer>

</section>
