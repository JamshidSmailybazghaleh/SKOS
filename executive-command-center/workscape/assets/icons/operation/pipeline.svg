<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="24"
    height="24"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round">

    <!-- Pipeline Nodes -->

    <circle
        cx="4"
        cy="12"
        r="1.5"/>

    <circle
        cx="12"
        cy="12"
        r="1.5"/>

    <circle
        cx="20"
        cy="12"
        r="1.5"/>

    <!-- Connections -->

    <line
        x1="5.5"
        y1="12"
        x2="10.5"
        y2="12"/>

    <line
        x1="13.5"
        y1="12"
        x2="18.5"
        y2="12"/>

    <!-- Flow Direction -->

    <polyline
        points="17.5,10.5 19,12 17.5,13.5"/>

</svg>
