<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="24"
    height="24"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round">

    <!-- Start Node -->
    <circle
        cx="5"
        cy="12"
        r="2"/>

    <!-- Middle Node -->
    <rect
        x="10"
        y="9"
        width="4"
        height="6"
        rx="1"/>

    <!-- End Node -->
    <circle
        cx="19"
        cy="12"
        r="2"/>

    <!-- Flow Arrows -->
    <line
        x1="7"
        y1="12"
        x2="10"
        y2="12"/>

    <polyline
        points="9,11 10,12 9,13"/>

    <line
        x1="14"
        y1="12"
        x2="17"
        y2="12"/>

    <polyline
        points="16,11 17,12 16,13"/>

</svg>
