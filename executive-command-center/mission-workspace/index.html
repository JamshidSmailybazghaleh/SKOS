<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SKOS Mission Workspace</title>

    <link rel="stylesheet"
          href="css/workspace.css">

</head>

<body>

<header class="workspace-header">

    <h1>Mission Workspace</h1>

    <div id="workspace-status">
        OFFLINE
    </div>

</header>

<main class="workspace-layout">

    <section id="mission-panel"
             class="workspace-panel">
    </section>

    <section id="progress-panel"
             class="workspace-panel">
    </section>

    <section id="task-panel"
             class="workspace-panel">
    </section>

    <section id="milestone-panel"
             class="workspace-panel">
    </section>

    <section id="operation-panel"
             class="workspace-panel">
    </section>

    <section id="history-panel"
             class="workspace-panel">
    </section>

</main>

<footer class="workspace-footer">

    <span>

        From Data to Wisdom

    </span>

</footer>

<script src="js/data-loader.js"></script>

<script src="js/mission-renderer.js"></script>

<script src="js/task-renderer.js"></script>

<script src="js/milestone-renderer.js"></script>

<script src="js/operation-renderer.js"></script>

<script src="js/progress-renderer.js"></script>

<script src="js/history-renderer.js"></script>

<script src="js/workspace-controller.js"></script>

<script src="js/app.js"></script>

</body>

      </html>
